function renderSidebar() {
  const statuses = stepStatuses();
  const items = STEPS.map((s, i) => {
    const st = statuses[s.id] || 'locked';
    const stage = STEP_STAGE[s.id];
    const sg = STAGE_CLASS[stage];
    const num = st === 'done' ? '✓' : s.id;
    const sub = st === 'active' && NODES[current] ? (NODES[current].title || NODES[current].question || '').slice(0, 34) : '';
    const conn = i < STEPS.length - 1 ? '<div class="step-connector"></div>' : '';
    return `<div class="step-row">
      <div class="step-item ${st} ${sg}" ${st !== 'done' ? '' : 'onclick="void(0)"'}>
        <div class="step-circle">${num}</div>
        <div>
          <div class="step-label">${s.name}</div>
          ${sub ? `<div style="font-size:11px;color:var(--text-muted)">${sub}${sub.length>=34?'…':''}</div>` : ''}
        </div>
      </div></div>${conn}`;
  }).join('');
  document.getElementById('stepList').innerHTML = items;
  renderTrail();
}

function renderTrail() {
  const m = metrics;

  // Surplus display
  const surpVal = m.surplus !== undefined ? `${m.surplus >= 0 ? '+' : '−'}£${fmt(Math.abs(m.surplus))}` : null;
  const surpCls = m.surplus !== undefined ? (m.surplus < 0 ? 'bad' : m.surplus < 100 ? 'warn' : 'good') : '';

  // Emergency fund
  const efRaw = m.savings !== undefined && m.essential > 0 ? m.savings / m.essential : null;
  const efVal = efRaw !== null ? `${efRaw.toFixed(1)} months` : null;
  const efCls = efRaw !== null ? (efRaw >= 3 ? 'good' : efRaw >= 1 ? '' : 'bad') : '';

  // Pension
  const penVal = m.pensionMaxMonthly !== undefined ? (m.pensionFull ? 'Captured' : 'Missing') : null;
  const penCls = m.pensionMaxMonthly !== undefined ? (m.pensionFull ? 'good' : 'bad') : '';

  // Goals monthly
  const gmVal = m.goalMonthly > 0 ? `£${fmt(m.goalMonthly)}/mo` : null;
  const gmCls = m.goalMonthly > 0 && m.surplus > 0 ? (m.goalMonthly <= m.surplus ? 'good' : 'warn') : '';

  // Build rows with divider markers
  const items = [
    { key:'Monthly income',   val: m.income   ? `£${fmt(m.income)}`  : null, cls:'' },
    { key:'Monthly surplus',  val: surpVal, cls: surpCls },
    { divider: true },
    { key:'Emergency fund',   val: efVal,   cls: efCls },
    { key:'Pension match',    val: penVal,  cls: penCls },
    { divider: true },
    { key:'Highest APR',      val: m.highestAPR ? `${m.highestAPR.toFixed(1)}%` : null,  cls: m.highestAPR > 10 ? 'bad' : '' },
    { key:'Monthly interest', val: m.monthlyInt > 0 ? `£${fmt(m.monthlyInt)}/mo` : null, cls: m.monthlyInt > 0 ? 'bad' : '' },
    { key:'Total debt',       val: m.totalDebt > 0 ? `£${fmt(m.totalDebt)}` : null,      cls: '' },
    { divider: true },
    { key:'Goals defined',    val: m.goalsCount ? `${m.goalsCount}` : null, cls: m.goalsCount ? 'good' : '' },
    { key:'Goal saving/mo',   val: gmVal,   cls: gmCls },
  ];

  const html = items.map(r => {
    if (r.divider) return `<hr class="sb-divider" style="margin:5px 0">`;
    return `<div class="trail-row">
      <span class="trail-key">${r.key}</span>
      <span class="trail-val ${r.val ? r.cls : 'none'}">${r.val || '—'}</span>
    </div>`;
  }).join('');

  const el = document.getElementById('journeyTrail');
  if (el) el.innerHTML = html;
}

function renderMobileBar() {
  const statuses = stepStatuses();
  document.getElementById('mobileBar').innerHTML = STEPS.map(s => {
    const st = statuses[s.id] || 'locked';
    const sg = STAGE_CLASS[STEP_STAGE[s.id]];
    const num = st === 'done' ? '✓' : s.id;
    return `<div class="ms-pill ${st} ${sg}"><div class="ms-num">${num}</div>${s.short}</div>`;
  }).join('');
  const active = document.querySelector('.ms-pill.active');
  if (active) active.scrollIntoView({ inline:'center', behavior:'smooth' });
}

// ═══════════════════════════════════════════════════════════════
// TOPBAR UPDATER
// ═══════════════════════════════════════════════════════════════
const STAGE_BAND_COLORS = { 1:'#e1b5b5', 2:'#e7d08a', 3:'#bfd7a6', 4:'#bfd2ea', 5:'#c2b4e4' };

function renderTopbar() {
  const n      = NODES[current];
  const topbar = document.querySelector('.topbar');
  const sigil  = document.querySelector('.topbar-sigil');
  const sub    = document.querySelector('.topbar-sub');
  const bar    = document.getElementById('progressBar');
  if (!topbar) return;

  if (!n || n.type === 'start' || current === 'start') {
    // Default brand state
    topbar.style.borderBottom = '';
    if (sigil) { sigil.style.background = ''; sigil.style.color = ''; }
    if (sub)   sub.textContent = 'Interactive Flowchart · v3.0.10';
    if (bar)   bar.style.background = '';
  } else {
    const color = STAGE_BAND_COLORS[n.stage] || '#c8c8c8';
    topbar.style.borderBottom = `2px solid ${color}`;
    if (sigil) { sigil.style.background = color; sigil.style.color = 'var(--text-primary)'; }
    if (sub)   sub.textContent = n.badge || `Step ${n.step || ''}`;
    if (bar)   bar.style.background = color;
  }
}

// ═══════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════
function render() {
  const n = NODES[current];
  if (!n) return;
  const sg = STAGE_CLASS[n.stage] || 'sg0';

  let html = '';
  if (n.type === 'start')    html = renderStart(n, sg);
  else if (n.type === 'question') html = renderQuestion(current, n, sg);
  else if (n.type === 'info')     html = renderInfo(current, n, sg);
  else if (n.type === 'outcome')  html = renderOutcome(current, n, sg);
  else html = renderActionById(current, sg);  // action, warning

  document.getElementById('cardMount').innerHTML = html;
  document.getElementById('progressBar').style.width = getProgress() + '%';
  renderTopbar();
  renderSidebar();
  renderMobileBar();
}

// ═══════════════════════════════════════════════════════════════
// TOGGLE WHY
// ═══════════════════════════════════════════════════════════════
function toggleWhy(nodeId) {
  const btn  = document.getElementById(`wt-${nodeId}`);
  const body = document.getElementById(`wb-${nodeId}`);
  if (!btn || !body) return;
  const open = body.classList.toggle('open');
  btn.classList.toggle('open', open);
}

// ═══════════════════════════════════════════════════════════════
// SAVED TOAST
// ═══════════════════════════════════════════════════════════════
let saveTimer;
function flashSaved() {
  const el = document.getElementById('savedToast');
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ═══════════════════════════════════════════════════════════════
// INPUT PANEL TOGGLE
// ═══════════════════════════════════════════════════════════════
function updateInsightCards(nodeId) {
  calculateMetrics();
  const ic = document.getElementById(`ic-${nodeId}`);
  if (!ic) return;
  const cards = getInsightCards(nodeId);
  ic.innerHTML = renderCardList(cards);
  // Refresh goals allocation chart if present
  const gc = document.getElementById(`gc-${nodeId}`);
  if (gc) gc.innerHTML = renderGoalsChart();
  renderTrail();
  // Debounce localStorage writes to avoid hammering on rapid keystrokes
  clearTimeout(updateInsightCards._saveTimer);
  updateInsightCards._saveTimer = setTimeout(saveState, 500);
}

// ═══════════════════════════════════════════════════════════════
// EVENT DELEGATION
// ═══════════════════════════════════════════════════════════════
document.addEventListener('click', e => {
  // Input panel header toggle
  const iph = e.target.closest('[id^="iph-"]');
  if (iph) {
    const nid = iph.dataset.nid;
    if (!nid) return;
    ipOpen[nid] = !ipOpen[nid];
    iph.classList.toggle('open', !!ipOpen[nid]);
    const body = document.getElementById(`ipb-${nid}`);
    if (body) body.classList.toggle('open', !!ipOpen[nid]);
    return;
  }

  // Add debt row
  if (e.target.dataset.add === 'debt') {
    userInputs.debts = userInputs.debts || [];
    userInputs.debts.push({ type:'', balance:'', apr:'', minPayment:'' });
    const nid = e.target.dataset.nid;
    ipOpen[nid] = true;
    render();
    // re-open panel after render
    const body = document.getElementById(`ipb-${nid}`);
    const hdr  = document.getElementById(`iph-${nid}`);
    if (body) { body.classList.add('open'); }
    if (hdr)  { hdr.classList.add('open'); }
    return;
  }

  // Delete debt row
  if (e.target.dataset.del !== undefined) {
    const idx = +e.target.dataset.del;
    userInputs.debts.splice(idx, 1);
    calculateMetrics();
    render();
    const nid = current;
    ipOpen[nid] = true;
    const body = document.getElementById(`ipb-${nid}`);
    const hdr  = document.getElementById(`iph-${nid}`);
    if (body) body.classList.add('open');
    if (hdr)  hdr.classList.add('open');
    saveState();
    return;
  }

  // Add goal row
  if (e.target.dataset.add === 'goal') {
    userInputs.goals = userInputs.goals || [];
    userInputs.goals.push({ name:'', amount:'', years:'' });
    const nid = e.target.dataset.nid;
    ipOpen[nid] = true;
    render();
    const body = document.getElementById(`ipb-${nid}`);
    const hdr  = document.getElementById(`iph-${nid}`);
    if (body) body.classList.add('open');
    if (hdr)  hdr.classList.add('open');
    return;
  }

  // Delete goal row
  if (e.target.dataset.gdel !== undefined) {
    const idx = +e.target.dataset.gdel;
    userInputs.goals.splice(idx, 1);
    calculateMetrics();
    render();
    const nid = current;
    ipOpen[nid] = true;
    const body = document.getElementById(`ipb-${nid}`);
    const hdr  = document.getElementById(`iph-${nid}`);
    if (body) body.classList.add('open');
    if (hdr)  hdr.classList.add('open');
    saveState();
    return;
  }
});

document.addEventListener('input', e => {
  // Standard input panel fields
  const iid = e.target.dataset.iid;
  if (iid) {
    userInputs[iid] = e.target.value;
    updateInsightCards(current);
    return;
  }

  // Debt field input
  const di = e.target.dataset.di;
  const df = e.target.dataset.df;
  if (di !== undefined && df) {
    userInputs.debts = userInputs.debts || [];
    while (userInputs.debts.length <= +di) userInputs.debts.push({});
    userInputs.debts[+di][df] = e.target.value;
    updateInsightCards(current);
    return;
  }

  // Goal field input
  const gi = e.target.dataset.gi;
  const gf = e.target.dataset.gf;
  if (gi !== undefined && gf) {
    userInputs.goals = userInputs.goals || [];
    while (userInputs.goals.length <= +gi) userInputs.goals.push({});
    userInputs.goals[+gi][gf] = e.target.value;
    // Live-update Type pill and Monthly needed column
    const row = e.target.closest('tr');
    if (row) {
      const g    = userInputs.goals[+gi];
      const yrs  = +g.years;
      const amt  = +g.amount;
      if (gf === 'years') {
        const typeTd = row.querySelector('td:nth-child(4)');
        if (typeTd) typeTd.innerHTML = yrs >= 5 ? '<span class="goal-horizon-pill g-long">Long-term</span>'
                                      : yrs > 0  ? '<span class="goal-horizon-pill g-short">Short-term</span>' : '';
      }
      if (gf === 'amount' || gf === 'years') {
        const moTd = row.querySelector('td:nth-child(5)');
        if (moTd) {
          if (amt > 0 && yrs > 0) {
            moTd.className = 'goal-monthly-cell';
            moTd.textContent = `£${fmt(amt / (yrs * 12))}/mo`;
          } else {
            moTd.className = 'goal-monthly-cell blank';
            moTd.textContent = '—';
          }
        }
      }
    }
    updateInsightCards(current);
    return;
  }
});

// ═══════════════════════════════════════════════════════════════
// RESUME BANNER
// ═══════════════════════════════════════════════════════════════
function showResumeBanner(saved) {
  const nd = NODES[saved.current];
  if (!nd || saved.current === 'start') return;
  const label = (nd.title || nd.question || saved.current).slice(0, 50);
  const ts = saved.ts ? new Date(saved.ts).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
  document.getElementById('resumeWrap').innerHTML = `
    <div class="resume-banner">
      <div class="resume-text">
        <p>Continue where you left off?</p>
        <span>${label} · ${ts}</span>
      </div>
      <div class="resume-btns">
        <button class="btn-resume primary" onclick="doResume()">Resume</button>
        <button class="btn-resume secondary" onclick="dismissResume()">Start fresh</button>
      </div>
    </div>`;
}

function doResume() {
  document.getElementById('resumeWrap').innerHTML = '';
}

function dismissResume() {
  clearState();
  current = 'start'; history = []; answers = {}; userInputs = {}; metrics = {}; ipOpen = {};
  document.getElementById('resumeWrap').innerHTML = '';
  render();
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
(function init() {
  const saved = loadState();
  if (saved && saved.current && saved.current !== 'start' && NODES[saved.current]) {
    // Show start first, then resume banner
    render();
    // Load saved state
    history    = saved.history    || [];
    answers    = saved.answers    || {};
    userInputs = saved.userInputs || {};
    ipOpen     = saved.ipOpen     || {};
    current    = saved.current;
    // Backward-compat: migrate monthlyTotal → monthlyDiscretionary
    if (userInputs.monthlyTotal && !userInputs.monthlyDiscretionary) {
      const total = +userInputs.monthlyTotal;
      const ess   = +userInputs.monthlyEssential || 0;
      const sav   = +userInputs.monthlySavings   || 0;
      userInputs.monthlyDiscretionary = String(Math.max(0, total - ess - sav));
    }
    calculateMetrics();
    showResumeBanner(saved);
  } else {
    render();
  }
})();
</script>
</body>
</html>
